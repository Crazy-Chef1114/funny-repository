spring:
  application:
    name: convenient-office
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  webflux:
    static-path-pattern: "/static/**"
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

server:
  port: 8086
  compression:
    enabled: true

openai:
  api:
    key: ${OPENAI_API_KEY:}
    url: ${OPENAI_API_URL:https://api.openai.com/v1}
    timeout: 30s

app:
  file:
    upload:
      max-size: 50MB
      allowed-extensions: .xlsx, .xls
    processing:
      max-rows: 100000
      max-columns: 100

logging:
  level:
    com.xzz.independent: INFO
    org.apache.poi: WARN


